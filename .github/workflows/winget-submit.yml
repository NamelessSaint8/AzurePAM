# Submit a WinGet manifest PR to microsoft/winget-pkgs on every release.
#
# Fires on `release: published` (the moment you click Publish on a GitHub
# release). The vedantmgoyal9/winget-releaser action runs wingetcreate,
# pulls the installer asset off the release, computes its SHA256, builds
# the three required YAML manifests (Stells.EntraChecks.installer.yaml,
# Stells.EntraChecks.locale.en-US.yaml, Stells.EntraChecks.yaml), forks
# microsoft/winget-pkgs into the account behind WINGET_TOKEN, pushes a
# branch, and opens a PR against microsoft/winget-pkgs.
#
# Setup needed once: create a repo secret `WINGET_TOKEN` containing a
# fine-grained GitHub PAT with `Contents: write` and `Pull requests:
# write` on a user (or org) account that's been authorised to fork
# microsoft/winget-pkgs. Without that secret the job is a no-op (it logs
# a friendly explanation and exits). See README "Code signing
# (SmartScreen warning)" / "Packaging" for the wider context.
#
# The very first submission gets human review by the WinGet maintainers
# (typically 1-3 days). After it's merged, future tag pushes auto-submit
# updates against the established Stells.EntraChecks identifier.

name: WinGet submission

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (e.g. v1.7.0)"
        required: true

jobs:
  publish:
    name: Submit ${{ github.event.release.tag_name || inputs.tag }} to winget-pkgs
    runs-on: windows-latest
    steps:
      - name: Check secret presence
        id: gate
        shell: pwsh
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TOKEN)) {
            Write-Host "::warning::WINGET_TOKEN secret is not set; skipping submission."
            Write-Host "To enable: create a fine-grained PAT (Contents: write + Pull requests: write)"
            Write-Host "and add it as a repo secret named WINGET_TOKEN."
            "submit=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "submit=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Submit manifest
        if: steps.gate.outputs.submit == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Stells.EntraChecks
          # The exact installer asset name pattern Tauri's NSIS bundler
          # produces (matches EntraChecks_<version>_x64-setup.exe on the
          # release Assets list).
          installers-regex: 'EntraChecks_.*_x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
          # If triggered via workflow_dispatch with an explicit tag,
          # override the action's default (which reads the release event).
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
